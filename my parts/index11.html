<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing Page - Redirect to Spare Catalog</title>
    <script>
        // Redirect to the spare catalog section after 2 seconds
        window.onload = function() {
            setTimeout(function() {
                // Redirect to the parts catalog page and scroll to the catalog section
                window.location.href = "index.html#catalog-section";
            }, 2000);
        };
    </script>
</head>
<body>
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif;">
        <h1>Welcome! Redirecting to UG-Spares...</h1>
    </div>
</body>
</html>
